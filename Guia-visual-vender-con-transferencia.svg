<svg viewBox="0 0 640 1460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Calibri, Arial, sans-serif">
  <title>Guía visual — Vender con transferencia</title>
  <desc>Siete pasos para aplicar una transferencia recibida a una venta: abrir la pestaña Transferencias, buscar por RUN o nombre, revisar el resultado, tocar "Usar", volver a la pantalla Vender con el tipo de venta ya en Transferencia, completar el carrito, y registrar y entregar el comprobante. Incluye dos consejos: cómo corregir una transferencia elegida por error y cómo funciona la búsqueda sin señal.</desc>
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="1460" fill="#ffffff"/>

  <text x="320" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#12233d">Vender con transferencia</text>
  <text x="320" y="56" text-anchor="middle" font-size="14" fill="#666666">Guía visual paso a paso — Vendedor</text>

  <line x1="70" y1="212" x2="70" y2="1128" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round"/>

  <circle cx="70" cy="140" r="32" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="70" y="149" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a5f">1</text>
  <rect x="140" y="75" width="440" height="130" rx="14" fill="#ffffff" stroke="#dcdfdd" stroke-width="1.5"/>
  <text x="170" y="112" font-size="18" font-weight="700" fill="#12233d">💳 Abrir "Transferencias"</text>
  <text x="170" y="139" font-size="14" fill="#666666">Ir a esa pestaña desde el menú</text>
  <text x="170" y="159" font-size="14" fill="#666666">superior de la app</text>

  <circle cx="70" cy="310" r="32" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="70" y="319" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a5f">2</text>
  <rect x="140" y="245" width="440" height="130" rx="14" fill="#ffffff" stroke="#dcdfdd" stroke-width="1.5"/>
  <text x="170" y="282" font-size="18" font-weight="700" fill="#12233d">🔍 Buscar el pago</text>
  <text x="170" y="309" font-size="14" fill="#666666">Ingresar el RUN o el nombre</text>
  <text x="170" y="329" font-size="14" fill="#666666">completo del cliente</text>

  <circle cx="70" cy="480" r="32" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="70" y="489" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a5f">3</text>
  <rect x="140" y="415" width="440" height="130" rx="14" fill="#ffffff" stroke="#dcdfdd" stroke-width="1.5"/>
  <text x="170" y="452" font-size="18" font-weight="700" fill="#12233d">📋 Revisar el resultado</text>
  <text x="170" y="479" font-size="14" fill="#666666">Confirmar la fecha y el monto</text>
  <text x="170" y="499" font-size="14" fill="#666666">del abono disponible</text>

  <circle cx="70" cy="650" r="32" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="70" y="659" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a5f">4</text>
  <rect x="140" y="585" width="440" height="130" rx="14" fill="#ffffff" stroke="#dcdfdd" stroke-width="1.5"/>
  <text x="170" y="622" font-size="18" font-weight="700" fill="#12233d">👉 Tocar "Usar"</text>
  <text x="170" y="649" font-size="14" fill="#666666">En la transferencia que</text>
  <text x="170" y="669" font-size="14" fill="#666666">corresponda de la lista</text>

  <circle cx="70" cy="820" r="32" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="70" y="829" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a5f">5</text>
  <rect x="140" y="755" width="440" height="130" rx="14" fill="#ffffff" stroke="#dcdfdd" stroke-width="1.5"/>
  <text x="170" y="792" font-size="18" font-weight="700" fill="#12233d">🔄 Vuelve a Vender solo</text>
  <text x="170" y="819" font-size="14" fill="#666666">El tipo de venta ya queda en</text>
  <text x="170" y="839" font-size="14" fill="#666666">"Transferencia" automáticamente</text>

  <circle cx="70" cy="990" r="32" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="70" y="999" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a5f">6</text>
  <rect x="140" y="925" width="440" height="130" rx="14" fill="#ffffff" stroke="#dcdfdd" stroke-width="1.5"/>
  <text x="170" y="962" font-size="18" font-weight="700" fill="#12233d">🛒 Completar el carrito</text>
  <text x="170" y="989" font-size="14" fill="#666666">Agregar los productos y</text>
  <text x="170" y="1009" font-size="14" fill="#666666">revisar el total</text>

  <circle cx="70" cy="1160" r="32" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="70" y="1169" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a5f">7</text>
  <rect x="140" y="1095" width="440" height="130" rx="14" fill="#ffffff" stroke="#dcdfdd" stroke-width="1.5"/>
  <text x="170" y="1132" font-size="18" font-weight="700" fill="#12233d">✅ Registrar y entregar</text>
  <text x="170" y="1159" font-size="14" fill="#666666">Tocar "Registrar venta" e</text>
  <text x="170" y="1179" font-size="14" fill="#666666">imprimir o compartir el comprobante</text>

  <rect x="40" y="1260" width="560" height="170" rx="14" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="64" y="1292" font-size="16" font-weight="700" fill="#1e3a5f">💡 Consejos</text>

  <text x="64" y="1320" font-size="13" fill="#12233d" font-weight="700">¿Transferencia equivocada?</text>
  <text x="64" y="1340" font-size="13" fill="#666666">Tocar "Quitar" en el cartel de Vender antes de registrar.</text>

  <text x="64" y="1370" font-size="13" fill="#12233d" font-weight="700">¿Sin señal?</text>
  <text x="64" y="1390" font-size="13" fill="#666666">La búsqueda sigue funcionando con la última copia guardada.</text>
  <text x="64" y="1408" font-size="13" fill="#666666">Un cartel amarillo avisa si los datos pueden estar desactualizados.</text>
</svg>
